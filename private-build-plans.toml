[buildPlans.Iasevka]
family = "Iasevka"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

[buildPlans.Iasevka.variants]
inherits = "ss14"

[buildPlans.Iasevka.variants.design]
one = "base"
two = "curly-neck-serifless"
three = "two-arcs"
four = "closed-non-crossing-serifless"
five = "upright-arched-serifless"
six = "closed-contour"
seven = "bend-serifless"
eight = "two-circles"
nine = "closed-contour"
zero = "slashed"
capital-a = "straight-serifless"
capital-g = "toothless-rounded-serifless-hooked"
capital-i = "short-serifed"
capital-j = "serifless"
capital-k = "symmetric-connected-serifless"
capital-m = "flat-bottom-serifless"
capital-q = "curly-tailed"
capital-r = "standing-serifless"
capital-v = "straight-serifless"
capital-x = "straight-serifless"
a = "double-storey-serifless"
b = "toothed-serifless"
d = "toothed-serifless"
f = "serifless"
g = "single-storey-serifless"
i = "serifed"
j = "serifed"
l = "serifed-flat-tailed"
p = "eared-serifless"
q = "straight-serifless"
t = "bent-hook-short-neck"
y = "cursive-serifless"
brace = "curly"
at = "threefold"
question = "corner"
micro-sign = "toothless-rounded-serifless"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

[buildPlans.Iasevka.ligations]
inherits = "dlig"

[buildPlans.Iasevka.nerdFont]
enable = true
complete = true
mono = false

[buildPlans.Iasevka.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.Iasevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Iasevka.weights.Book]
shape = 450
menu = 450
css = 450

[buildPlans.Iasevka.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.Iasevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Iasevka.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.Iasevka.widths.SemiCondensed]
shape = 548
menu = 4
css = "semi-condensed"
