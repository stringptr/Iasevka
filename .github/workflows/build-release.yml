name: Build and Release Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    name: Build Iasevka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ttfautohint
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ttfautohint

      - name: Install dependencies
        run: npm install

      - name: Install font-patcher
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge
          git clone https://github.com/ryanoasis/nerd-fonts.git
          echo "$PWD/nerd-fonts" >> $GITHUB_PATH

      - name: Build Iasevka
        run: npm run build -- contents::Iasevka

      - name: Patch Nerd Fonts
        run: node tools/nerd-font-patcher/patch.mjs

      - name: Package artifacts
        run: |
          cd dist
          zip -r ../Iasevka-${{ github.ref_name }}.zip Iasevka/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Iasevka-*.zip
          generate_release_notes: true

      - name: Compute hash and update flake.nix
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          HASH=$(sha256sum ./Iasevka-${{ github.ref_name }}.zip | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          HASH_NIX="sha256-$HASH"
          VERSION="${{ github.ref_name }}"

          sed -i "s|releases/download/v[0-9.]*/Iasevka-v[0-9.]*.zip|releases/download/$VERSION/Iasevka-$VERSION.zip|" flake.nix
          sed -i "s|sha256 = \"sha256-[A-Za-z0-9+/=]*\"|sha256 = \"$HASH_NIX\"|" flake.nix

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git diff --cached --exit-code || (git commit -m "Update flake.nix for $VERSION" && git push origin HEAD:main)
